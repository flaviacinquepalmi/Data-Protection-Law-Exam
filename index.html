<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDPR & Cybersecurity Academy 🛡️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c27;
  --border: #2a2a3d;
  --accent: #6c63ff;
  --accent2: #ff6584;
  --accent3: #43e97b;
  --accent4: #f7971e;
  --text: #e8e8f0;
  --text2: #9090a8;
  --gold: #ffd700;
  --danger: #ff4757;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated bg */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background: radial-gradient(ellipse at 20% 20%, rgba(108,99,255,0.08) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 80%, rgba(255,101,132,0.06) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

/* ===== NAV ===== */
#nav {
  position:fixed;top:0;left:0;right:0;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  height:64px;
}

#nav .logo {
  font-family:'Syne',sans-serif;
  font-size:1.3rem;font-weight:800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

#nav .nav-pills {
  display:flex;gap:4px;
}

.nav-pill {
  padding:8px 16px;
  border-radius:20px;
  border:none;
  background:transparent;
  color:var(--text2);
  cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  font-size:.85rem;font-weight:600;
  transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.nav-pill:hover, .nav-pill.active {
  background:var(--surface2);
  color:var(--text);
}
.nav-pill.active { color:var(--accent); }

#xp-bar {
  display:flex;align-items:center;gap:10px;
  font-size:.85rem;
}
#xp-bar .level-badge {
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  padding:4px 12px;border-radius:20px;
  font-weight:700;font-size:.8rem;
}
.xp-track {
  width:120px;height:8px;
  background:var(--border);border-radius:4px;overflow:hidden;
}
.xp-fill {
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:4px;
  transition:width .5s ease;
}

/* ===== PAGES ===== */
.page { display:none; padding-top:80px; min-height:100vh; }
.page.active { display:block; }

/* ===== HOME ===== */
#home {
  padding-top:80px;
  display:none;
}
#home.active { display:block; }

.hero {
  text-align:center;
  padding:60px 24px 40px;
}
.hero h1 {
  font-family:'Syne',sans-serif;
  font-size:clamp(2.5rem,6vw,4.5rem);
  font-weight:800;
  line-height:1.1;
  margin-bottom:16px;
}
.hero h1 span {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p { color:var(--text2);font-size:1.1rem;max-width:600px;margin:0 auto 40px; }

.stats-row {
  display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  margin-bottom:60px;padding:0 24px;
}
.stat-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px 28px;
  text-align:center;
  min-width:130px;
}
.stat-card .num {
  font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent3),#00c6ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.stat-card .lbl { color:var(--text2);font-size:.8rem;margin-top:4px; }

.chapters-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
  padding:0 24px 60px;
  max-width:1400px;margin:0 auto;
}

.chapter-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  cursor:pointer;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.chapter-card::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  opacity:0;transition:opacity .25s;border-radius:16px;
}
.chapter-card:hover { transform:translateY(-4px);border-color:var(--accent); }
.chapter-card:hover::before { opacity:.06; }

.chapter-card .ch-num {
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;color:var(--accent);
  margin-bottom:8px;letter-spacing:2px;
  text-transform:uppercase;
}
.chapter-card h3 {
  font-size:1rem;font-weight:700;margin-bottom:8px;
  position:relative;z-index:1;
}
.chapter-card p {
  font-size:.82rem;color:var(--text2);
  position:relative;z-index:1;
  line-height:1.5;
}
.chapter-card .ch-footer {
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;
  position:relative;z-index:1;
}
.ch-xp {
  font-size:.75rem;font-weight:600;
  color:var(--accent4);
  display:flex;align-items:center;gap:4px;
}
.ch-arrow {
  width:32px;height:32px;border-radius:50%;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all .2s;
}
.chapter-card:hover .ch-arrow {
  background:var(--accent);transform:translateX(4px);
}
.ch-progress {
  margin-top:12px;height:3px;background:var(--border);border-radius:2px;
  position:relative;z-index:1;
}
.ch-progress-fill {
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:2px;transition:width .5s;
}

/* ===== CHAPTER DETAIL ===== */
#chapter-detail { padding-top:80px;display:none; }
#chapter-detail.active { display:block; }

.chapter-header {
  padding:40px 24px 32px;
  max-width:900px;margin:0 auto;
}
.back-btn {
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  padding:8px 16px;border-radius:20px;
  cursor:pointer;font-size:.85rem;color:var(--text2);
  margin-bottom:24px;transition:all .2s;font-family:'Space Grotesk',sans-serif;
}
.back-btn:hover { color:var(--text);border-color:var(--accent); }

.chapter-header h1 {
  font-family:'Syne',sans-serif;
  font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;
  margin-bottom:12px;
}
.chapter-header .ch-desc {
  color:var(--text2);font-size:1rem;line-height:1.6;
  margin-bottom:24px;
}

.content-tabs {
  display:flex;gap:8px;margin-bottom:32px;
}
.content-tab {
  padding:10px 20px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;font-family:'Space Grotesk',sans-serif;
  font-size:.85rem;font-weight:600;color:var(--text2);
  transition:all .2s;
}
.content-tab.active {
  background:var(--accent);border-color:var(--accent);color:#fff;
}

.tab-content { display:none;max-width:900px;margin:0 auto;padding:0 24px 60px; }
.tab-content.active { display:block; }

/* THEORY */
.theory-section {
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px;margin-bottom:20px;
}
.theory-section h2 {
  font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;
  margin-bottom:16px;color:var(--accent);
  display:flex;align-items:center;gap:10px;
}
.theory-section h3 {
  font-size:1rem;font-weight:700;margin:20px 0 10px;
  color:var(--accent4);
}
.theory-section p { color:var(--text);line-height:1.7;margin-bottom:12px;font-size:.92rem; }
.theory-section ul { padding-left:20px;margin-bottom:12px; }
.theory-section li { color:var(--text);line-height:1.7;margin-bottom:6px;font-size:.92rem; }
.theory-section strong { color:var(--accent2); }

.key-box {
  background:rgba(108,99,255,0.1);
  border:1px solid rgba(108,99,255,0.3);
  border-radius:12px;padding:16px 20px;
  margin:16px 0;
}
.key-box .key-label {
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:var(--accent);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;
}
.key-box p { margin:0;font-size:.9rem;color:var(--text); }

.case-box {
  background:rgba(255,101,132,0.08);
  border:1px solid rgba(255,101,132,0.25);
  border-radius:12px;padding:16px 20px;margin:16px 0;
}
.case-box .case-label {
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:var(--accent2);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;
}

/* QUIZ */
.quiz-intro {
  text-align:center;padding:40px 0;
}
.quiz-intro h2 { font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:12px; }
.quiz-intro p { color:var(--text2);margin-bottom:24px; }

.start-btn {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;padding:14px 36px;border-radius:30px;
  color:#fff;font-family:'Space Grotesk',sans-serif;
  font-size:1rem;font-weight:700;cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.start-btn:hover { transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,99,255,.4); }

.quiz-container { display:none; }
.quiz-container.active { display:block; }

.quiz-progress-bar {
  height:4px;background:var(--border);border-radius:2px;
  margin-bottom:32px;overflow:hidden;
}
.quiz-progress-fill {
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .4s;
}

.quiz-q-num {
  font-family:'JetBrains Mono',monospace;
  font-size:.8rem;color:var(--text2);
  letter-spacing:2px;margin-bottom:12px;
}
.quiz-question {
  font-size:1.1rem;font-weight:600;
  line-height:1.6;margin-bottom:28px;
}
.quiz-options { display:flex;flex-direction:column;gap:12px;margin-bottom:24px; }

.quiz-opt {
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:12px;
  padding:16px 20px;
  cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  font-size:.92rem;
  text-align:left;
  color:var(--text);
  transition:all .2s;
  display:flex;align-items:center;gap:12px;
}
.quiz-opt:hover:not(.disabled) { border-color:var(--accent);background:rgba(108,99,255,.08); }
.quiz-opt.correct { border-color:var(--accent3)!important;background:rgba(67,233,123,.12)!important;color:var(--accent3); }
.quiz-opt.wrong { border-color:var(--danger)!important;background:rgba(255,71,87,.1)!important;color:var(--danger); }
.quiz-opt.disabled { cursor:not-allowed; }

.opt-letter {
  width:28px;height:28px;border-radius:50%;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.8rem;font-weight:700;flex-shrink:0;
}

.quiz-feedback {
  display:none;
  background:var(--surface2);border-radius:12px;
  padding:20px;margin-bottom:20px;
  border-left:4px solid var(--accent3);
}
.quiz-feedback.wrong-fb { border-left-color:var(--danger); }
.quiz-feedback .fb-title { font-weight:700;margin-bottom:8px; }
.quiz-feedback p { font-size:.9rem;color:var(--text2);line-height:1.6; }

.quiz-nav {
  display:flex;justify-content:space-between;align-items:center;
}
.next-btn {
  background:var(--accent);border:none;
  padding:12px 28px;border-radius:20px;
  color:#fff;font-family:'Space Grotesk',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;
  transition:all .2s;display:none;
}
.next-btn:hover { background:#5a52e0;transform:translateX(4px); }

.score-display {
  display:none;text-align:center;padding:40px 0;
}
.score-display h2 { font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:8px; }
.big-score {
  font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent3),#00c6ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:16px 0;
}
.xp-earned {
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(247,151,30,.15);border:1px solid rgba(247,151,30,.3);
  padding:10px 20px;border-radius:20px;
  color:var(--accent4);font-weight:700;font-size:1rem;
  margin-bottom:24px;
}

/* ARTICLES CHALLENGE */
.article-challenge { }
.ac-intro { text-align:center;padding:40px 0; }
.ac-intro h2 { font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:12px; }

.ac-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px;margin-bottom:20px;
  display:none;
}
.ac-card.active { display:block; }

.ac-article-ref {
  font-family:'JetBrains Mono',monospace;
  font-size:1rem;color:var(--accent2);
  font-weight:700;margin-bottom:8px;
}
.ac-prompt {
  font-size:1.1rem;font-weight:600;margin-bottom:20px;line-height:1.5;
}
.ac-hint {
  font-size:.85rem;color:var(--text2);margin-bottom:16px;
  display:flex;align-items:center;gap:6px;
}

.ac-input {
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:12px;
  padding:16px;
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  font-size:.92rem;
  resize:vertical;min-height:120px;
  transition:border-color .2s;
}
.ac-input:focus { outline:none;border-color:var(--accent); }

.ac-btns { display:flex;gap:12px;margin-top:16px;flex-wrap:wrap; }
.reveal-btn {
  background:var(--surface2);border:1px solid var(--border);
  padding:10px 20px;border-radius:20px;
  color:var(--text2);font-family:'Space Grotesk',sans-serif;
  font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.reveal-btn:hover { border-color:var(--accent);color:var(--accent); }

.ac-answer {
  display:none;
  background:rgba(67,233,123,.08);
  border:1px solid rgba(67,233,123,.25);
  border-radius:12px;padding:20px;margin-top:16px;
}
.ac-answer .ans-title {
  font-weight:700;color:var(--accent3);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.ac-answer p { font-size:.9rem;line-height:1.7;color:var(--text2); }
.ac-answer strong { color:var(--text); }

.self-rate {
  display:none;
  margin-top:16px;
  text-align:center;
}
.self-rate p { color:var(--text2);font-size:.9rem;margin-bottom:12px; }
.rate-btns { display:flex;justify-content:center;gap:10px; }
.rate-btn {
  padding:10px 20px;border-radius:20px;
  border:none;font-family:'Space Grotesk',sans-serif;
  font-size:.85rem;font-weight:700;cursor:pointer;
  transition:all .2s;
}
.rate-btn.good { background:rgba(67,233,123,.2);color:var(--accent3); }
.rate-btn.ok { background:rgba(247,151,30,.2);color:var(--accent4); }
.rate-btn.bad { background:rgba(255,71,87,.15);color:var(--danger); }
.rate-btn:hover { transform:scale(1.05); }

/* ===== LEADERBOARD / PROGRESS ===== */
#progress-page { padding-top:80px; }

.progress-inner { max-width:900px;margin:0 auto;padding:40px 24px 60px; }
.progress-inner h1 {
  font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;
  margin-bottom:32px;
}

.progress-grid {
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;margin-bottom:40px;
}
.progress-ch {
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:20px;
}
.progress-ch .pch-name {
  font-size:.9rem;font-weight:700;margin-bottom:8px;
}
.progress-ch .pch-stats {
  display:flex;gap:16px;margin-bottom:12px;
}
.pstat { text-align:center; }
.pstat .n { font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800; }
.pstat .n.green { color:var(--accent3); }
.pstat .n.purple { color:var(--accent); }
.pstat .l { font-size:.72rem;color:var(--text2); }

.achievements-section h2 {
  font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;
  margin-bottom:20px;
}
.achievements-grid {
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
}
.achievement {
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;text-align:center;
  opacity:.4;transition:all .3s;
}
.achievement.unlocked {
  opacity:1;border-color:var(--gold);
  background:rgba(255,215,0,.05);
}
.achievement .ach-icon { font-size:2rem;margin-bottom:8px; }
.achievement .ach-name { font-size:.82rem;font-weight:700; }
.achievement .ach-desc { font-size:.72rem;color:var(--text2);margin-top:4px; }

/* Toast */
#toast {
  position:fixed;bottom:24px;right:24px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;
  z-index:1000;
  transform:translateX(200px);opacity:0;
  transition:all .4s cubic-bezier(.175,.885,.32,1.275);
  max-width:320px;
}
#toast.show { transform:translateX(0);opacity:1; }
#toast .toast-icon { font-size:1.5rem; }
#toast .toast-text { font-size:.88rem; }
#toast .toast-text strong { display:block;margin-bottom:2px; }

/* Combo */
.combo-display {
  font-family:'Syne',sans-serif;
  font-size:.9rem;color:var(--accent4);font-weight:800;
}

.chapter-tag {
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;
  font-size:.72rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  margin-bottom:16px;
}
.tag-gdpr { background:rgba(108,99,255,.15);color:var(--accent); }
.tag-cyber { background:rgba(255,101,132,.15);color:var(--accent2); }
.tag-ai { background:rgba(67,233,123,.15);color:var(--accent3); }

</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <div class="logo">⚖️ LexAcademy</div>
  <div class="nav-pills">
    <button class="nav-pill active" data-page="home" onclick="showPage('home')">🏠 Home</button>
    <button class="nav-pill" data-page="progress-page" onclick="showPage('progress-page')">📊 Progresso</button>
  </div>
  <div id="xp-bar">
    <div class="level-badge" id="level-label">Lv.1</div>
    <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    <span id="xp-text" style="font-size:.8rem;color:var(--text2)">0 XP</span>
  </div>
</nav>

<!-- HOME -->
<div id="home" class="page active">
  <div class="hero">
    <h1>Studia il Diritto<br><span>Come un Game</span></h1>
    <p>GDPR, Cybersecurity & AI Act — 20 capitoli, quiz gamificati, sfide articoli. Diventa un esperto in 10 ore.</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="stat-xp">0</div>
      <div class="lbl">XP Totali</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-correct">0</div>
      <div class="lbl">Risposte Corrette</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-streak">0</div>
      <div class="lbl">Streak 🔥</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-chapters">0/20</div>
      <div class="lbl">Capitoli Completati</div>
    </div>
  </div>

  <div class="chapters-grid" id="chapters-grid"></div>
</div>

<!-- CHAPTER DETAIL -->
<div id="chapter-detail" class="page">
  <div class="chapter-header">
    <button class="back-btn" onclick="showPage('home')">← Torna ai Capitoli</button>
    <div id="ch-tag"></div>
    <h1 id="ch-title"></h1>
    <p class="ch-desc" id="ch-desc"></p>

function renderChapters() {
  const grid = document.getElementById('chapters-grid');
  grid.innerHTML = '';
  chapters.forEach(ch => {
    const prog = state.chapterProgress[ch.id] || {};
    const pct = prog.quizDone ? 100 : (prog.quizStarted ? 50 : 0);
    const tagClass = {gdpr:'tag-gdpr',cyber:'tag-cyber',ai:'tag-ai'}[ch.tag];
    grid.innerHTML += `
    <div class="chapter-card" onclick="openChapter(${ch.id})">
      <div class="ch-num">CAP. ${ch.id < 10 ? '0'+ch.id : ch.id}</div>
      <h3>${ch.title}</h3>
      <p>${ch.desc}</p>
      <div class="ch-footer">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="chapter-tag ${tagClass}">${ch.tagLabel}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="ch-xp">⚡ ${ch.xp} XP</span>
          <div class="ch-arrow">${prog.quizDone ? '✅' : '→'}</div>
        </div>
      </div>
      <div class="ch-progress"><div class="ch-progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  });
}

// =====================================================
let currentChapter = null;
function openChapter(id) {
  currentChapter = chapters.find(c => c.id === id);
  if(!currentChapter) return;

  const tagClass = {gdpr:'tag-gdpr',cyber:'tag-cyber',ai:'tag-ai'}[currentChapter.tag];
  document.getElementById('ch-tag').innerHTML = `<span class="chapter-tag ${tagClass}">${currentChapter.tagLabel}</span>`;
  document.getElementById('ch-title').textContent = currentChapter.title;
  document.getElementById('ch-desc').textContent = currentChapter.desc;

  // Render theory
  document.getElementById('tab-theory').innerHTML = currentChapter.theory;

  // Render quiz
  renderQuiz(currentChapter);

  // Render articles
  renderArticles(currentChapter);

  // Reset tabs
  document.querySelectorAll('.content-tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.getElementById('tab-theory').classList.add('active');
  document.getElementById('tab-quiz').classList.remove('active');
  document.getElementById('tab-articles').classList.remove('active');

  showPage('chapter-detail');
}

let quizState = { idx:0, score:0, answered:false, combo:0 };

function renderQuiz(ch) {
  const container = document.getElementById('tab-quiz');
  container.innerHTML = `
  <div class="quiz-intro">
    <h2>🧠 Quiz: ${ch.title}</h2>
    <p>${ch.quiz.length} domande · Rispondi correttamente per guadagnare XP e mantenere il tuo streak!</p>
    <button class="start-btn" onclick="startQuiz()">🚀 Inizia Quiz</button>
  </div>
  <div class="quiz-container" id="quiz-main">
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="q-prog" style="width:0%"></div></div>
    <div class="quiz-q-num" id="q-num"></div>
    <div class="quiz-question" id="q-text"></div>
    <div class="quiz-options" id="q-opts"></div>
    <div class="quiz-feedback" id="q-fb"></div>
    <div class="quiz-nav">
      <div class="combo-display" id="q-combo"></div>
      <button class="next-btn" id="q-next" onclick="nextQuestion()">Prossima →</button>
    </div>
  </div>
  <div class="score-display" id="quiz-score">
    <h2>🎉 Quiz Completato!</h2>
    <div class="big-score" id="final-score-txt"></div>
    <div class="xp-earned" id="xp-earned-txt"></div>
    <button class="start-btn" onclick="startQuiz()">🔄 Riprova</button>
  </div>`;
}

function startQuiz() {
  quizState = { idx:0, score:0, answered:false, combo: quizState.combo||0 };
  document.querySelector('.quiz-intro').style.display='none';
  document.getElementById('quiz-main').classList.add('active');
  document.getElementById('quiz-score').style.display='none';
  showQuestion();
}

function showQuestion() {
  const q = currentChapter.quiz[quizState.idx];
  const total = currentChapter.quiz.length;
  document.getElementById('q-prog').style.width = ((quizState.idx/total)*100)+'%';
  document.getElementById('q-num').textContent = `Domanda ${quizState.idx+1} di ${total}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-fb').style.display='none';
  document.getElementById('q-next').style.display='none';
  quizState.answered = false;

  const letters = ['A','B','C','D'];
  document.getElementById('q-opts').innerHTML = q.opts.map((opt,i) => `
    <button class="quiz-opt" onclick="answerQuestion(${i})">
      <div class="opt-letter">${letters[i]}</div>
      ${opt}
    </button>`).join('');

  document.getElementById('q-combo').textContent = quizState.combo > 1 ? `🔥 Combo x${quizState.combo}!` : '';
}

function answerQuestion(idx) {
  if(quizState.answered) return;
  quizState.answered = true;
  const q = currentChapter.quiz[quizState.idx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.classList.add('disabled'));

  const correct = idx === q.correct;
  opts[idx].classList.add(correct ? 'correct' : 'wrong');
  opts[q.correct].classList.add('correct');

  const fb = document.getElementById('q-fb');
  fb.style.display='block';
  fb.className = 'quiz-feedback' + (correct ? '' : ' wrong-fb');
  fb.innerHTML = `<div class="fb-title">${correct ? '✅ Corretto!' : '❌ Non esatto'}</div><p>${q.exp}</p>`;

  if(correct) {
    quizState.score++;
    quizState.combo++;
    state.correct++;
    state.streak = Math.max(state.streak||0, quizState.combo);
    const xpGain = correct ? (quizState.combo >= 3 ? 15 : 10) : 0;
    addXP(xpGain);
    if(quizState.combo === 3) showToast('🔥','Combo x3!','Sei in fiamma! +15 XP bonus','var(--accent4)');
  } else {
    quizState.combo = 0;
    state.streak = 0;
  }
  state.total++;
  saveState();
  document.getElementById('q-next').style.display='block';
  document.getElementById('q-combo').textContent = quizState.combo > 1 ? `🔥 Combo x${quizState.combo}!` : '';
}

function nextQuestion() {
  quizState.idx++;
  if(quizState.idx >= currentChapter.quiz.length) {
    finishQuiz();
  } else {
    showQuestion();
  }
}

function finishQuiz() {
  document.getElementById('quiz-main').classList.remove('active');
  document.getElementById('quiz-score').style.display='block';
  const pct = Math.round((quizState.score / currentChapter.quiz.length) * 100);
  document.getElementById('final-score-txt').textContent = `${quizState.score}/${currentChapter.quiz.length}`;
  const xpTotal = quizState.score * 10;
  document.getElementById('xp-earned-txt').innerHTML = `⚡ +${xpTotal} XP guadagnati`;

  if(!state.chapterProgress[currentChapter.id]) state.chapterProgress[currentChapter.id] = {};
  state.chapterProgress[currentChapter.id].quizDone = true;
  state.chapterProgress[currentChapter.id].score = pct;
  saveState();
  checkAchievements();
  renderChapters();
  updateStats();

  if(pct === 100) showToast('🏆','Perfetto!','Hai risposto correttamente a tutte le domande!','var(--gold)');
  else if(pct >= 80) showToast('⭐','Ottimo!',`${pct}% corretto!`,'var(--accent3)');
  else showToast('💪','Continua ad allenare!',`${pct}% — riprova per migliorare`,'var(--accent)');
}

  const msgs = {good:'Ottimo! +15 XP', ok:'Quasi! +8 XP', bad:'Non ti preoccupare! +3 XP — rileggi la teoria'};
  showToast('⚖️','Articolo Valutato',msgs[rating]);
  document.getElementById(`ac-rate-${i}`).innerHTML = `<p style="color:var(--accent3)">✅ Valutazione registrata! +${xp} XP</p>`;
}

// =====================================================
// TABS
// =====================================================
function switchTab(name) {
  document.querySelectorAll('.content-tab').forEach((t,i) => {
    const names = ['theory','quiz','articles'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
}

// =====================================================
// PROGRESS PAGE
// =====================================================
function renderProgressPage() {
  const grid = document.getElementById('progress-grid');
  grid.innerHTML = chapters.map(ch => {
    const prog = state.chapterProgress[ch.id] || {};
    return `
    <div class="progress-ch">
      <div class="pch-name">${ch.title}</div>
      <div class="pch-stats">
        <div class="pstat"><div class="n ${prog.quizDone?'green':'purple'}">${prog.score||0}%</div><div class="l">Quiz Score</div></div>
        <div class="pstat"><div class="n purple">${ch.xp}</div><div class="l">Max XP</div></div>
      </div>
      <div class="ch-progress"><div class="ch-progress-fill" style="width:${prog.quizDone?100:0}%"></div></div>
    </div>`;
  }).join('');

  renderAchievements();
}

const achievementsList = [
  { id:'first_quiz', icon:'🎯', name:'Prima Sfida', desc:'Completa il tuo primo quiz' },
  { id:'streak3', icon:'🔥', name:'On Fire!', desc:'Raggiungi una combo x3' },
  { id:'perfect', icon:'💯', name:'Perfezionista', desc:'100% in un quiz' },
  { id:'five_chapters', icon:'📚', name:'Studente', desc:'Completa 5 capitoli' },
  { id:'all_gdpr', icon:'⚖️', name:'GDPR Master', desc:'Completa tutti i capitoli GDPR' },
  { id:'cybersec', icon:'🛡️', name:'Cyber Defender', desc:'Completa tutti i capitoli Cyber' },
  { id:'xp500', icon:'⚡', name:'Energy Drink', desc:'Raggiungi 500 XP' },
  { id:'xp2000', icon:'🚀', name:'Expert', desc:'Raggiungi 2000 XP' },
];

function checkAchievements() {
  const done = Object.values(state.chapterProgress).filter(p => p.quizDone).length;
  const gdprDone = chapters.filter(c => c.tag==='gdpr').every(c => state.chapterProgress[c.id]?.quizDone);
  const cyberDone = chapters.filter(c => c.tag==='cyber').every(c => state.chapterProgress[c.id]?.quizDone);
  const perfect = Object.values(state.chapterProgress).some(p => p.score === 100);

  if(done >= 1 && !state.achievements.first_quiz) { state.achievements.first_quiz=true; showToast('🎯','Achievement!','Prima Sfida completata!','var(--gold)'); }
  if(state.streak >= 3 && !state.achievements.streak3) { state.achievements.streak3=true; showToast('🔥','Achievement!','On Fire! Combo x3','var(--gold)'); }
  if(perfect && !state.achievements.perfect) { state.achievements.perfect=true; showToast('💯','Achievement!','Perfezionista! 100% corretto','var(--gold)'); }
  if(done >= 5 && !state.achievements.five_chapters) { state.achievements.five_chapters=true; showToast('📚','Achievement!','Studente — 5 capitoli completati','var(--gold)'); }
  if(gdprDone && !state.achievements.all_gdpr) { state.achievements.all_gdpr=true; showToast('⚖️','Achievement!','GDPR Master!','var(--gold)'); }
  if(cyberDone && !state.achievements.cybersec) { state.achievements.cybersec=true; showToast('🛡️','Achievement!','Cyber Defender!','var(--gold)'); }
  if(state.xp >= 500 && !state.achievements.xp500) { state.achievements.xp500=true; showToast('⚡','Achievement!','Energy Drink — 500 XP','var(--gold)'); }
  if(state.xp >= 2000 && !state.achievements.xp2000) { state.achievements.xp2000=true; showToast('🚀','Achievement!','Expert — 2000 XP','var(--gold)'); }
  saveState();
}

function renderAchievements() {
  document.getElementById('achievements-grid').innerHTML = achievementsList.map(a => `
    <div class="achievement ${state.achievements[a.id]?'unlocked':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`).join('');
}

// =====================================================
// PAGE NAVIGATION
// =====================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-pill').forEach(p => p.classList.toggle('active', p.dataset.page === id));

  if(id === 'progress-page') renderProgressPage();
  if(id === 'home') renderChapters();
}

// =====================================================
// INIT
// =====================================================
updateXPBar();
updateStats();
renderChapters();
</script>
</body>
</html>
